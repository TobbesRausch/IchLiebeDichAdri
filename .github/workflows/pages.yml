name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site and convert HEIC photos
        env:
          HEIC_CONVERTER_ROOT: ${{ runner.temp }}/heic-converter
        run: |
          mkdir -p _site
          cp index.html app.js style.css texte.json _site/
          cp -R Fotos _site/Fotos
          npm install --prefix "$HEIC_CONVERTER_ROOT" --no-save --no-package-lock heic-convert@2.1.0
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const convert = require(path.join(process.env.HEIC_CONVERTER_ROOT, 'node_modules', 'heic-convert'));
          const photoDir = path.join('_site', 'Fotos');
          const listPath = path.join(photoDir, 'fotos.json');

          async function preparePhotos() {
            const sourceNames = JSON.parse(fs.readFileSync(listPath, 'utf8'));
            const publishedNames = [];

            for (const name of sourceNames) {
              if (!/\.HEIC$/i.test(name)) {
                publishedNames.push(name);
                continue;
              }

              const outputName = name.replace(/\.HEIC$/i, '.jpg');
              const output = await convert({
                buffer: fs.readFileSync(path.join(photoDir, name)),
                format: 'JPEG',
                quality: 0.9,
              });
              fs.writeFileSync(path.join(photoDir, outputName), output);
              publishedNames.push(outputName);
            }

            fs.writeFileSync(listPath, `${JSON.stringify(publishedNames, null, 2)}\n`);
          }

          preparePhotos().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
